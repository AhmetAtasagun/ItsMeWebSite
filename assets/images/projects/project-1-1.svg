<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f18"/>
      <stop offset="100%" stop-color="#16192b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" rx="12" fill="url(#bg1)" stroke="#27273a" stroke-width="1.5"/>
  <!-- Window Header -->
  <rect width="800" height="42" rx="12" fill="#121422"/>
  <rect y="30" width="800" height="12" fill="#121422"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#27273a" stroke-width="1"/>
  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="21" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">tenant-cluster.saas.internal // Overview</text>
  
  <!-- Content: Dashboard Cards -->
  <g transform="translate(30, 65)">
    <!-- Metric 1 -->
    <rect width="220" height="85" rx="8" fill="#181b2e" stroke="#27273a"/>
    <text x="16" y="28" fill="#94a3b8" font-family="monospace" font-size="11">Aktif Kiracılar (Tenants)</text>
    <text x="16" y="60" fill="#f1f5f9" font-family="monospace" font-size="24" font-weight="bold">1,482</text>
    <text x="150" y="60" fill="#10b981" font-family="monospace" font-size="12">+12.4%</text>

    <!-- Metric 2 -->
    <rect x="250" width="220" height="85" rx="8" fill="#181b2e" stroke="#27273a"/>
    <text x="266" y="28" fill="#94a3b8" font-family="monospace" font-size="11">Aylık Gelir (MRR)</text>
    <text x="266" y="60" fill="#06b6d4" font-family="monospace" font-size="24" font-weight="bold">$48,250</text>
    <text x="400" y="60" fill="#10b981" font-family="monospace" font-size="12">+8.1%</text>

    <!-- Metric 3 -->
    <rect x="500" width="240" height="85" rx="8" fill="#181b2e" stroke="#27273a"/>
    <text x="516" y="28" fill="#94a3b8" font-family="monospace" font-size="11">Sistem Uptime</text>
    <text x="516" y="60" fill="#10b981" font-family="monospace" font-size="24" font-weight="bold">99.98%</text>
    <text x="650" y="60" fill="#94a3b8" font-family="monospace" font-size="12">SLA: OK</text>
  </g>

  <!-- Big Chart & Tenant List -->
  <g transform="translate(30, 175)">
    <!-- Chart area -->
    <rect width="470" height="235" rx="8" fill="#181b2e" stroke="#27273a"/>
    <text x="20" y="30" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="bold">İstek Trafiği &amp; API Çağrıları (Son 24s)</text>
    <!-- Wave / Polyline Chart -->
    <path d="M 30 190 Q 90 110, 150 140 T 270 90 T 380 130 T 450 60" fill="none" stroke="url(#accent1)" stroke-width="3"/>
    <path d="M 30 190 Q 90 110, 150 140 T 270 90 T 380 130 T 450 60 L 450 200 L 30 200 Z" fill="url(#accent1)" opacity="0.1"/>
    <!-- Grid lines -->
    <line x1="30" y1="70" x2="450" y2="70" stroke="#27273a" stroke-dasharray="4"/>
    <line x1="30" y1="120" x2="450" y2="120" stroke="#27273a" stroke-dasharray="4"/>
    <line x1="30" y1="170" x2="450" y2="170" stroke="#27273a" stroke-dasharray="4"/>
  </g>

  <!-- Tenant isolation status -->
  <g transform="translate(530, 175)">
    <rect width="240" height="235" rx="8" fill="#181b2e" stroke="#27273a"/>
    <text x="16" y="30" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="bold">İzole Veritabanları</text>
    
    <rect x="16" y="50" width="208" height="42" rx="4" fill="#121422" stroke="#33374f"/>
    <circle cx="32" cy="71" r="5" fill="#10b981"/>
    <text x="48" y="75" fill="#f1f5f9" font-family="monospace" font-size="11">tenant_alpha_db</text>
    <text x="175" y="75" fill="#94a3b8" font-family="monospace" font-size="10">PgSQL</text>

    <rect x="16" y="102" width="208" height="42" rx="4" fill="#121422" stroke="#33374f"/>
    <circle cx="32" cy="123" r="5" fill="#10b981"/>
    <text x="48" y="127" fill="#f1f5f9" font-family="monospace" font-size="11">tenant_beta_db</text>
    <text x="175" y="127" fill="#94a3b8" font-family="monospace" font-size="10">PgSQL</text>

    <rect x="16" y="154" width="208" height="42" rx="4" fill="#121422" stroke="#33374f"/>
    <circle cx="32" cy="175" r="5" fill="#06b6d4"/>
    <text x="48" y="179" fill="#f1f5f9" font-family="monospace" font-size="11">tenant_gamma_db</text>
    <text x="175" y="179" fill="#94a3b8" font-family="monospace" font-size="10">Redis</text>
  </g>
</svg>
