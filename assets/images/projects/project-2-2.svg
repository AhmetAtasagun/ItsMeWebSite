<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bg22)" stroke="#27273a" stroke-width="1.5"/>
  <rect width="800" height="42" rx="12" fill="#121422"/>
  <rect y="30" width="800" height="12" fill="#121422"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#27273a" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="21" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">api.ecommerce.internal/swagger // OpenApi v3</text>

  <!-- Swagger endpoints list -->
  <g transform="translate(30, 60)">
    <!-- GET item -->
    <rect width="740" height="52" rx="6" fill="#13231d" stroke="#10b981" stroke-width="1"/>
    <rect x="12" y="11" width="60" height="30" rx="4" fill="#10b981"/>
    <text x="42" y="31" fill="#0d1117" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">GET</text>
    <text x="88" y="32" fill="#f1f5f9" font-family="monospace" font-size="13">/api/v1/orders/{orderId}</text>
    <text x="650" y="32" fill="#10b981" font-family="monospace" font-size="12">200 OK (14ms)</text>

    <!-- POST item -->
    <rect y="65" width="740" height="52" rx="6" fill="#162233" stroke="#06b6d4" stroke-width="1"/>
    <rect x="12" y="76" width="60" height="30" rx="4" fill="#06b6d4"/>
    <text x="42" y="96" fill="#0d1117" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">POST</text>
    <text x="88" y="97" fill="#f1f5f9" font-family="monospace" font-size="13">/api/v1/checkout/process</text>
    <text x="650" y="97" fill="#06b6d4" font-family="monospace" font-size="12">202 ACCEPTED</text>

