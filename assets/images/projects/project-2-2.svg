    <rect y="195" width="740" height="175" rx="6" fill="#0c0e17" stroke="#27273a"/>
    <text x="20" y="225" fill="#94a3b8" font-family="monospace" font-size="11">[14:32:01 INF] [OrderConsumer] Received OrderCreatedEvent: Id=9f4a-81c0 Total=$149.99</text>
    <text x="20" y="250" fill="#10b981" font-family="monospace" font-size="11">[14:32:01 INF] [InventoryHandler] Stock reserved successfully for SKU: 4091</text>
    <text x="20" y="275" fill="#06b6d4" font-family="monospace" font-size="11">[14:32:02 INF] [PaymentWorker] Dispatched StripePaymentCommand via OutboxPublisher</text>
    <text x="20" y="300" fill="#94a3b8" font-family="monospace" font-size="11">[14:32:02 INF] [AuditTrail] Tenant 4402 audit entry committed with correlation ID: #cor-8819</text>
