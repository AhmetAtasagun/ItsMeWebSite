<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#141727"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bg12)" stroke="#27273a" stroke-width="1.5"/>
  <rect width="800" height="42" rx="12" fill="#121422"/>
  <rect y="30" width="800" height="12" fill="#121422"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#27273a" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="21" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">tenant-cluster.saas.internal // Roles &amp; Permissions Engine</text>

  <!-- Code / JSON viewer -->
  <g transform="translate(30, 65)">
    <rect width="740" height="345" rx="8" fill="#10121d" stroke="#27273a"/>
    <text x="25" y="35" fill="#7c3aed" font-family="'JetBrains Mono', monospace" font-size="13">// RBAC Policy Definition</text>
    
    <text x="25" y="70" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12"><tspan fill="#06b6d4">public class</tspan> <tspan fill="#f59e0b">TenantPermissionFilter</tspan> : <tspan fill="#94a3b8">IAsyncActionFilter</tspan> {</text>
    <text x="50" y="95" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12"><tspan fill="#06b6d4">public async</tspan> Task <tspan fill="#10b981">OnActionExecutionAsync</tspan>(ActionExecutingContext ctx, ActionExecutionDelegate next) {</text>
    <text x="75" y="120" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">var tenantId = ctx.HttpContext.User.FindFirst(<tspan fill="#10b981">"tenant_id"</tspan>)?.Value;</text>
    <text x="75" y="145" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">var hasPermission = <tspan fill="#06b6d4">await</tspan> _policyService.ValidateScopeAsync(tenantId, ctx.ActionDescriptor);</text>
    <text x="75" y="170" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12"><tspan fill="#06b6d4">if</tspan> (!hasPermission) {</text>
    <text x="100" y="195" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="12">ctx.Result = <tspan fill="#06b6d4">new</tspan> ForbidResult();</text>
    <text x="100" y="220" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12"><tspan fill="#06b6d4">return</tspan>;</text>
    <text x="75" y="245" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">}</text>
    <text x="75" y="270" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="12">await <tspan fill="#f1f5f9">next();</tspan></text>
    <text x="50" y="295" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">}</text>
    <text x="25" y="320" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">}</text>
  </g>
</svg>
