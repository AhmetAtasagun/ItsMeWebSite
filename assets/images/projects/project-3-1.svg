<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg31" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#11182c"/>
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bg31)" stroke="#27273a" stroke-width="1.5"/>
  <rect width="800" height="42" rx="12" fill="#121422"/>
  <rect y="30" width="800" height="12" fill="#121422"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#27273a" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="21" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">signalr-hub // Real-time WebSocket Analytics</text>

  <!-- Live Pulse Bar -->
  <g transform="translate(30, 60)">
    <rect width="740" height="40" rx="6" fill="#151b2c" stroke="#27273a"/>
    <circle cx="25" cy="20" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="24" fill="#10b981" font-family="monospace" font-size="12">SignalR Bağlantısı Aktif (Latency: 12ms)</text>
    <text x="640" y="24" fill="#94a3b8" font-family="monospace" font-size="11">Aktif Soket: 3,210</text>
  </g>

  <!-- Big Interactive Area Chart -->
  <g transform="translate(30, 115)">
    <rect width="740" height="295" rx="8" fill="#121727" stroke="#27273a"/>
    <text x="24" y="32" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="bold">Canlı Telemetri &amp; Bant Genişliği Akışı</text>

    <!-- Grid lines -->
    <line x1="30" y1="70" x2="710" y2="70" stroke="#1f273d" stroke-dasharray="4"/>
    <line x1="30" y1="130" x2="710" y2="130" stroke="#1f273d" stroke-dasharray="4"/>
    <line x1="30" y1="190" x2="710" y2="190" stroke="#1f273d" stroke-dasharray="4"/>
    <line x1="30" y1="250" x2="710" y2="250" stroke="#1f273d" stroke-dasharray="4"/>

    <!-- Path with gradient -->
    <path d="M 30 230 C 120 180, 160 210, 240 120 C 320 50, 390 160, 480 90 C 560 30, 630 110, 710 60 L 710 260 L 30 260 Z" fill="url(#neonPulse)"/>
    <path d="M 30 230 C 120 180, 160 210, 240 120 C 320 50, 390 160, 480 90 C 560 30, 630 110, 710 60" fill="none" stroke="#06b6d4" stroke-width="3"/>
    
    <!-- Marker dot -->
    <circle cx="710" cy="60" r="5" fill="#06b6d4"/>
    <circle cx="710" cy="60" r="10" fill="#06b6d4" opacity="0.3">
      <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
