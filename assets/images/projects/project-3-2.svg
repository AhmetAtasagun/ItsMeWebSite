<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#121626"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bg32)" stroke="#27273a" stroke-width="1.5"/>
  <rect width="800" height="42" rx="12" fill="#121422"/>
  <rect y="30" width="800" height="12" fill="#121422"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#27273a" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="21" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">signalr-hub // Alert Engine &amp; Threshold Rules</text>

  <!-- 3 Alert Cards -->
  <g transform="translate(30, 65)">
    <!-- Card 1 -->
    <rect width="740" height="95" rx="8" fill="#15192c" stroke="#27273a"/>
    <circle cx="35" cy="47" r="14" fill="rgba(16, 185, 129, 0.15)"/>
    <path d="M 28 47 L 33 52 L 42 42" stroke="#10b981" stroke-width="2" fill="none"/>
    <text x="65" y="40" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="bold">CPU Load Threshold Rule</text>
    <text x="65" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Tetikleyici: CPU &gt; 85% for 3m · Durum: Normal (Anlık: 41%)</text>
    <rect x="620" y="32" width="90" height="30" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
    <text x="665" y="52" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">PASSED</text>

    <!-- Card 2 -->
    <rect y="115" width="740" height="95" rx="8" fill="#15192c" stroke="#27273a"/>
    <circle cx="35" cy="162" r="14" fill="rgba(245, 158, 11, 0.15)"/>
    <circle cx="35" cy="162" r="6" fill="#f59e0b"/>
    <text x="65" y="155" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="bold">Disk IOPS Spike Warning</text>
    <text x="65" y="180" fill="#94a3b8" font-family="monospace" font-size="11">Tetikleyici: NVMe Write &gt; 4500 IOPS · Durum: İzlemede (Anlık: 4210 IOPS)</text>
    <rect x="620" y="147" width="90" height="30" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b"/>
    <text x="665" y="167" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="middle">WARNED</text>

    <!-- Card 3 -->
    <rect y="230" width="740" height="95" rx="8" fill="#15192c" stroke="#27273a"/>
    <circle cx="35" cy="277" r="14" fill="rgba(6, 182, 212, 0.15)"/>
    <path d="M 28 277 L 33 282 L 42 272" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <text x="65" y="270" fill="#f1f5f9" font-family="monospace" font-size="13" font-weight="bold">WebSocket Heartbeat Ping</text>
    <text x="65" y="295" fill="#94a3b8" font-family="monospace" font-size="11">Her 15 saniyede otomatik ping gönderilir · Kayıp paket: %0.00</text>
    <rect x="620" y="262" width="90" height="30" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4"/>
    <text x="665" y="282" fill="#06b6d4" font-family="monospace" font-size="11" text-anchor="middle">HEALTHY</text>
  </g>
</svg>
