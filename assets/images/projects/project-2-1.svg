<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bg21)" stroke="#27273a" stroke-width="1.5"/>
  <rect width="800" height="42" rx="12" fill="#121422"/>
  <rect y="30" width="800" height="12" fill="#121422"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#27273a" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="21" r="6" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">api-gateway // Microservices Topology Map</text>

  <!-- Microservices diagram -->
  <g transform="translate(40, 70)">
    <!-- API Gateway Box -->
    <rect x="20" y="120" width="150" height="90" rx="8" fill="#181b2e" stroke="#7c3aed" stroke-width="2"/>
    <text x="95" y="155" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">API GATEWAY</text>
    <text x="95" y="180" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Ocelot / YARP :5000</text>

    <!-- Connectors -->
    <path d="M 170 165 L 290 85" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>
    <path d="M 170 165 L 290 165" stroke="#10b981" stroke-width="2"/>
    <path d="M 170 165 L 290 245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>

    <!-- Service 1: Order Service -->
    <rect x="290" y="45" width="180" height="80" rx="8" fill="#181b2e" stroke="#06b6d4"/>
    <text x="380" y="80" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Order Service</text>
    <text x="380" y="102" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">.NET 8 CQRS</text>

    <!-- Service 2: Catalog Service -->
    <rect x="290" y="135" width="180" height="60" rx="8" fill="#181b2e" stroke="#10b981"/>
    <text x="380" y="170" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Catalog Service</text>

    <!-- Service 3: Payment Service -->
    <rect x="290" y="215" width="180" height="80" rx="8" fill="#181b2e" stroke="#f59e0b"/>
    <text x="380" y="250" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Payment Service</text>
    <text x="380" y="272" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Outbox Pattern</text>

    <!-- RabbitMQ Broker -->
    <rect x="540" y="105" width="160" height="120" rx="10" fill="#1e1828" stroke="#ec4899" stroke-width="2"/>
    <text x="620" y="150" fill="#f472b6" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">RabbitMQ</text>
    <text x="620" y="175" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Event Bus</text>
    <text x="620" y="195" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">● 2.4k msg/sec</text>

    <!-- Broker links -->
    <path d="M 470 85 L 540 135" stroke="#ec4899" stroke-width="1.5"/>
    <path d="M 470 255 L 540 195" stroke="#ec4899" stroke-width="1.5"/>
  </g>
</svg>
